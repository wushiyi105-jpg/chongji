[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chongji"
version = "0.1.0"
description = "宠物养护 Agent —— 喂食量、疫苗到期、体重曲线、症状分级"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
chongji = "chongji.cli:main"

[tool.setuptools]
packages = ["chongji"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
